<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar — TikTok Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="page-wrap">
    <div class="auth card">
      <div class="mark">♪</div>
      <h1>Daftar</h1>
      <p class="sub">Buat akun, download unlimited</p>

      <form class="form" id="registerForm" novalidate>
        <div class="field anim-stagger">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="nama@email.com" autocomplete="email" required />
          <span class="hint" id="emailHint"></span>
        </div>
        <div class="field anim-stagger">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="min 6 karakter" autocomplete="new-password" required />
        </div>
        <div class="field anim-stagger">
          <label for="passwordConfirm">Konfirmasi</label>
          <input type="password" id="passwordConfirm" placeholder="ulangi password" autocomplete="new-password" required />
        </div>

        <div class="toast anim-stagger" id="toast" role="alert"></div>

        <button type="submit" class="btn btn-primary anim-stagger" id="registerBtn">
          <span class="label">Daftar</span>
          <span class="loader"></span>
        </button>
      </form>

      <div class="otp-wrap" id="otpWrap">
        <div class="otp-head">
          <label>Kode OTP</label>
          <p>Masukkan kode 6 digit dari <strong id="otpEmail"></strong></p>
        </div>
        <div class="otp-digits" id="otpDigits">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code" />
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
        </div>
        <div class="otp-actions">
          <button type="button" class="btn btn-primary btn-sm" id="verifyBtn">
            <span class="label">Verifikasi</span>
            <span class="loader"></span>
          </button>
          <button type="button" class="btn btn-ghost" id="resendBtn">Kirim ulang</button>
        </div>
        <small id="otpTimer">5:00</small>
      </div>

      <p class="auth-footer">Sudah punya akun? <a href="/">Masuk</a></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
